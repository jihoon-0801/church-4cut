name: 태블릿 앱 만들기
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: 앱 빌드
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: 실패하면 기록 올리기
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "태블릿 앱" --notes "교회 인생네컷 안드로이드 앱"
          tail -c 200000 build.log > build-log.txt
          gh release upload app build-log.txt --clobber
      - run: cp android/app/build/outputs/apk/release/app-release.apk church-4cut.apk
      - name: 내려받을 곳에 올리기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "태블릿 앱" --notes "교회 인생네컷 안드로이드 앱. 태블릿에서 church-4cut.apk 를 눌러 내려받아 설치해요."
          gh release upload app church-4cut.apk --clobber
