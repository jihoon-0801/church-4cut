<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인생네컷 받기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--ink:#121114;--sub:#6d6a74;--line:#e7e4ec;--soft:#f4f3f7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Gaegu",sans-serif;font-size:38px;text-align:center;margin:8px 0 0}
.card{border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
img,video{max-width:100%;max-height:70vh;border-radius:8px;display:block}
a.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;text-decoration:none;border-radius:14px;padding:15px;font-size:18px;font-weight:600}
p{margin:0;color:var(--sub);text-align:center;font-size:14px}
</style></head><body>
<main>
  <h1>오늘의 네컷이에요!</h1>
  <div class="card" id="photo" hidden><img id="img" alt="네컷 사진"><a class="btn" id="imgDl">사진 저장하기</a><p>버튼이 안 되면 사진을 길게 눌러 저장해 주세요.</p></div>
  <div class="card" id="movie" hidden><video id="vid" playsinline autoplay muted loop controls></video><a class="btn" id="vidDl">영상 저장하기</a></div>
  <p id="none" hidden>사진 주소가 없어요. QR을 다시 찍어 주세요.</p>
</main>
<script>
const q = new URLSearchParams(location.hash.slice(1));
const safe = u => /^https:\/\/res\.cloudinary\.com\//.test(u || '') ? u : '';
const attach = u => u.replace('/upload/', '/upload/fl_attachment/');
const i = safe(q.get('i')), v = safe(q.get('v'));
if (i) { document.getElementById('photo').hidden = false; document.getElementById('img').src = i; document.getElementById('imgDl').href = attach(i); }
if (v) { const mp4 = v.replace(/\.[a-z0-9]+$/i, '.mp4'); document.getElementById('movie').hidden = false; document.getElementById('vid').src = mp4; document.getElementById('vidDl').href = attach(mp4); }
if (!i && !v) document.getElementById('none').hidden = false;
</script>
</body></html>
